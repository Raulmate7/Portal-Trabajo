name: 🤖 Scraper Diario de Empleo

on:
  schedule:
    # Se ejecuta a las 07:00 UTC (08:00/09:00 España)
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependencias
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Ejecutar Robots
        env:
          # IZQUIERDA: Nombre que usa Python (no tocar)
          # DERECHA: Nombre de tu Secreto en GitHub (TUS NOMBRES)
          
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          cd backend
          python run_all.py
