name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1,3,5'  # 09:00 UTC on Mon, Wed, Fri

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

      # Optional: Run scheduled scripts (weekly article & Bluesky bot) on the schedule triggers
      - name: Run scheduled scripts
        if: github.event_name == 'schedule'
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          GOOGLE_INDEXING_CREDENTIALS: ${{ secrets.GOOGLE_INDEXING_CREDENTIALS }}
        run: |
          echo "Running weekly article generator"
          python3 backend/generate_weekly_article.py || true
          echo "Running Bluesky bot"
          python3 scripts/bluesky_bot.py || true
