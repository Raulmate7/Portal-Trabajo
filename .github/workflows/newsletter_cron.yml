name: 📧 Boletín Semanal (Lunes y Viernes)

on:
  schedule:
    # Lunes y Viernes a las 07:00 UTC (08:00 en España)
    - cron: '0 7 * * 1,5'
  workflow_dispatch:

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependencias
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📧 Enviar Correos
        env:
          # Mapeamos TUS secretos exactos:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          # (Supabase URL/Key no suelen hacer falta si usas DATABASE_URL con psycopg2, 
          # pero si tu script las usa, descomenta las siguientes lineas):
          # SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd backend
          python email_sender.py
