name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare Deployment Directory
        id: prep
        run: |
          mkdir -p deploy_dist
          # Copiar proxy de base de datos
          cp db_proxy.php deploy_dist/
          # Copiar backend excluyendo carpetas pesadas, datos sensibles, tests y .env local
          cp -r backend deploy_dist/
          rm -rf deploy_dist/backend/venv
          rm -rf deploy_dist/backend/node_modules
          rm -rf deploy_dist/backend/migration_data
          rm -rf deploy_dist/backend/tests
          rm -rf deploy_dist/backend/__pycache__
          rm -f deploy_dist/backend/.env
          rm -f deploy_dist/backend/*_log.txt
          rm -f deploy_dist/backend/*.sql

          # Crear .htaccess para denegar acceso HTTP directo al directorio backend
          printf "Options -Indexes\n<IfModule mod_authz_core.c>\n    Require all denied\n</IfModule>\n<IfModule !mod_authz_core.c>\n    Order Allow,Deny\n    Deny from all\n</IfModule>\n" > deploy_dist/backend/.htaccess

          # Crear .htaccess en deploy_dist para proteger ficheros con extensiones sensibles, error_log, *_log.txt y dotfiles
          printf "Options -Indexes\n<FilesMatch \"^\.\">\n    <IfModule mod_authz_core.c>\n        Require all denied\n    </IfModule>\n    <IfModule !mod_authz_core.c>\n        Order Allow,Deny\n        Deny from all\n    </IfModule>\n</FilesMatch>\n<FilesMatch \"(?i)(^error_log$|.*_log\\\\.txt$|\\\\.(env.*|json|sql|log|py|pyc|sh|md|bak|backup|conf|ini|yml|yaml|ts|tsx|map|lock)$)\">\n    <IfModule mod_authz_core.c>\n        Require all denied\n    </IfModule>\n    <IfModule !mod_authz_core.c>\n        Order Allow,Deny\n        Deny from all\n    </IfModule>\n</FilesMatch>\n<IfModule mod_headers.c>\n    Header always set Strict-Transport-Security \"max-age=31536000; includeSubDomains; preload\"\n</IfModule>\n" > deploy_dist/.htaccess

          # Resolver ruta del servidor de forma robusta (evitar evaluación booleana en YAML)
          TARGET_DIR="${{ secrets.FTP_SERVER_DIR }}"
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR="/public_html/"
          fi
          echo "server_dir=$TARGET_DIR" >> "$GITHUB_OUTPUT"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_dist/
          server-dir: ${{ steps.prep.outputs.server_dir }}
          dangerous-clean-slate: false
