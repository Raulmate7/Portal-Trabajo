name: Deploy Backend to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Deployment Directory
        run: |
          mkdir deploy_dist
          # Copiar proxy de base de datos
          cp db_proxy.php deploy_dist/
          # Copiar backend excluyendo carpetas pesadas y .env local
          cp -r backend deploy_dist/
          rm -rf deploy_dist/backend/venv
          rm -rf deploy_dist/backend/node_modules
          rm -f deploy_dist/backend/.env

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
          dangerous-clean-slate: false
