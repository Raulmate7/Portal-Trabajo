name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build Next.js app
        env:
          NEXT_PUBLIC_BASE_URL: https://portalempleoit.com
          DATABASE_URL: mysql://ecosier2_UserPortal:&+{Tv*GbZw4~Ye2;@localhost:3306/ecosier2_PortalEmpleo
        run: |
          cd frontend
          npm run build

      - name: Prepare Deployment Directory
        run: |
          mkdir deploy_dist
          cp -r frontend/.next deploy_dist/
          cp -r frontend/public deploy_dist/
          cp frontend/package.json deploy_dist/
          cp frontend/package-lock.json deploy_dist/
          cp frontend/server.js deploy_dist/
          cp frontend/next.config.ts deploy_dist/
          mkdir -p deploy_dist/tmp
          touch deploy_dist/tmp/restart.txt

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
          dangerous-clean-slate: false
